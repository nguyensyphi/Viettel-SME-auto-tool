services:
  postgres:
    image: postgres:16-alpine
    container_name: am_viettel_sme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: am
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: am_sme
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - am_sme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U am -d am_sme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: am_viettel_sme_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - am_sme_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  am_sme_pgdata:
  am_sme_redisdata:

